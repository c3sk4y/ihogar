  .bar { width:6px; border-radius:3px; flex:none; }
  .info { flex:1; min-width:0; }
  .x { font-size:13px; font-weight:500; margin-top:4px; }
  .side { display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid .full { grid-column:1 / 3; }

async function post(path, body) {
  const r = await fetch(path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && user && d.error === "unauthorized") { user = null; render(); }
  return { ok: r.ok, d };
}
async function get(path) {
  const r = await fetch(path); let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && user) { user = null; render(); }
  return { ok: r.ok, d };
}
async function loadData() {

  if (p.ok) prods = p.d.products;
  if (i.ok) inv = i.d.items;

  if (!form.location_id && locs.length) { const pa = locs.find((x) => x.name === "pantry"); form.location_id = (pa || locs[0]).id; }
}

}

function statusOf(r) {

function loadZXing() {

    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; s.onload = ok; s.onerror = ko; document.head.appendChild(s);

async function startScan() {
  const t = T[lang], v = document.getElementById("scan_v"), er = document.getElementById("scan_err");
  found = false; er.textContent = "";
  document.getElementById("scan_hint").textContent = t.scan_hint;
  document.getElementById("scan_close").textContent = t.scan_close;
  document.getElementById("scan").hidden = false;

  try {

    v.srcObject = stream; await v.play();
  } catch (e) { er.textContent = t.scan_noperm; return; }

    if ("BarcodeDetector" in window) {
      const f = (await BarcodeDetector.getSupportedFormats()).filter((x) => ["ean_13", "ean_8", "upc_a", "upc_e"].includes(x));

function shrink(file, max) {
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = ko; img.src = url;
  });
}
