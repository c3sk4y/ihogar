<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
  :root { --ink:#16181D; --muted:#4A4F5A; --line:#D9DCE3; --blue:#1F4E9C; --green:#2E8B57; --red:#C8372D; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-family:"Noto Sans",system-ui,sans-serif; font-size:15px; }
  .top { height:60px; padding:0 20px; display:flex; align-items:center; max-width:480px; margin:0 auto; }
  .logo { font-weight:700; font-size:19px; letter-spacing:-0.3px; }
  .lang { margin-left:auto; display:flex; border:1.5px solid var(--blue); border-radius:999px; overflow:hidden; }
  .lang button { border:0; background:#fff; color:var(--blue); font:700 12px "Noto Sans",sans-serif; padding:7px 12px; min-height:34px; cursor:pointer; }
  .lang button.on { background:var(--blue); color:#fff; }
  main { max-width:480px; margin:0 auto; padding:8px 20px 40px; }
  h1 { font-size:24px; letter-spacing:-0.4px; margin:6px 0 14px; }
  .tabs { display:flex; margin-bottom:18px; }
  .tab { flex:1; min-height:44px; border:0; background:#fff; font:700 14px "Noto Sans",sans-serif; color:var(--muted); border-bottom:3px solid var(--line); cursor:pointer; }
  .tab.on { color:var(--blue); border-bottom-color:var(--blue); }
  .f { margin-bottom:14px; }
  .lbl { font-size:11px; color:var(--muted); font-weight:500; margin-bottom:2px; display:block; }
  input { display:block; width:100%; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; min-height:48px; font:500 15px "Noto Sans",sans-serif; color:var(--ink); background:#fff; }
  input:focus { outline:2px solid var(--blue); outline-offset:1px; }
  .btn { border:0; border-radius:14px; font:700 15px "Noto Sans",sans-serif; min-height:52px; width:100%; cursor:pointer; }
  .p { background:var(--blue); color:#fff; } .p:disabled { opacity:.6; cursor:default; }
  .s { background:#fff; color:var(--blue); border:1.5px solid var(--blue); }
  .err { color:var(--red); font-weight:700; font-size:13px; margin:0 0 14px; }
  .t { font-size:12px; color:var(--muted); margin-top:12px; }
  .card { border:1.5px solid var(--line); border-radius:18px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--green); }
  .val { font-size:15px; font-weight:700; }
  #cf { margin-bottom:14px; min-height:65px; }
</style>
</head>
<body>
<div class="top"><span class="logo">Inventario</span>
  <div class="lang"><button id="es" aria-label="Español">ES</button><button id="en" aria-label="English">EN</button></div></div>
<main id="app"></main>
<script>
const SITE_KEY = "0x4AAAAAAFrhgjVPdQ5D-xno";
const T = {
  es: {
    login:"Ingresar", register:"Crear cuenta", email:"Correo", password:"Contrase\u00f1a", home:"Nombre del hogar",
    first:"Al crear tu cuenta se crea tu hogar y quedas como gestor. Podr\u00e1s invitar hasta 2 personas m\u00e1s.",
    rules:"Tras 3 intentos fallidos, el acceso se bloquea 15 minutos. Un correo pertenece a una sola cuenta y a un solo hogar.",
    wait:"Un momento...", out:"Cerrar sesi\u00f3n", role_manager:"Gestor", role_member:"Integrante", members:"Integrantes",
    of:"de", next:"Siguiente paso: ingreso de productos e inventario.", loading:"Cargando...",
    e:{ invalid_credentials:"Correo o contrase\u00f1a incorrectos. Te quedan {n} intentos.", locked:"Acceso bloqueado. Intenta de nuevo en {m} minutos.",
        captcha:"Completa la verificaci\u00f3n de seguridad.", email_in_use:"Este correo ya tiene una cuenta.", weak_password:"La contrase\u00f1a debe tener al menos 10 caracteres.",
        invalid_email:"Escribe un correo v\u00e1lido.", invalid_home:"Escribe un nombre para el hogar (hasta 60 caracteres).", network:"Sin conexi\u00f3n. Intenta de nuevo.", server:"Error del servidor. Intenta de nuevo.", server_config:"Falta configurar el servidor." }
  },
  en: {
    login:"Sign in", register:"Create account", email:"Email", password:"Password", home:"Home name",
    first:"Creating your account creates your home and makes you the manager. You can invite up to 2 more people.",
    rules:"After 3 failed attempts, access is locked for 15 minutes. One email belongs to one account and one home.",
    wait:"One moment...", out:"Sign out", role_manager:"Manager", role_member:"Member", members:"Members",
    of:"of", next:"Next step: product entry and inventory.", loading:"Loading...",
    e:{ invalid_credentials:"Incorrect email or password. {n} attempts left.", locked:"Access locked. Try again in {m} minutes.",
        captcha:"Complete the security check.", email_in_use:"This email already has an account.", weak_password:"Password must be at least 10 characters.",
        invalid_email:"Enter a valid email.", invalid_home:"Enter a home name (up to 60 characters).", network:"No connection. Try again.", server:"Server error. Try again.", server_config:"Server is not configured." }
  }
};
let lang = "es", mode = "login", user = null, token = "", err = "", busy = false, vals = { email:"", password:"", home:"" };
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function msg(code, d) {
  const m = T[lang].e[code] || T[lang].e.server;
  return m.replace("{n}", d && d.attempts_left).replace("{m}", d && d.retry_after ? Math.ceil(d.retry_after / 60) : "");
}
function mountCaptcha() {
  const el = document.getElementById("cf");
  if (!el) return;
  const go = () => {
    if (!window.turnstile) return setTimeout(go, 200);
    token = "";
    window.turnstile.render(el, { sitekey: SITE_KEY, language: lang, callback: (t) => { token = t; }, "expired-callback": () => { token = ""; } });
  };
  go();
}
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("es").className = lang === "es" ? "on" : "";
  document.getElementById("en").className = lang === "en" ? "on" : "";
  if (user === undefined) { app.innerHTML = '<p class="t">' + t.loading + "</p>"; return; }
  if (user) {
    const role = user.role === "manager" ? t.role_manager : t.role_member;
    app.innerHTML = '<h1>' + esc(user.home.name) + '</h1><div class="card"><div class="row"><span class="dot"></span><span class="val">' + esc(user.email) + '</span></div>' +
      '<div class="t">' + role + ' \u00b7 ' + t.members + ' ' + user.home.members + ' ' + t.of + ' ' + user.home.max + '</div></div>' +
      '<div class="t" style="margin:0 0 16px">' + t.next + '</div><button class="btn s" id="out">' + t.out + '</button>';
    document.getElementById("out").onclick = async () => { await post("/api/logout", {}); user = null; vals.password = ""; render(); };
    return;
  }
  const reg = mode === "register";
  app.innerHTML = '<h1>' + (reg ? t.register : t.login) + '</h1>' +
    '<div class="tabs"><button class="tab ' + (reg ? "" : "on") + '" id="tl">' + t.login + '</button><button class="tab ' + (reg ? "on" : "") + '" id="tr">' + t.register + '</button></div>' +
    '<div class="f"><label class="lbl" for="em">' + t.email + '</label><input id="em" type="email" autocomplete="email" value="' + esc(vals.email) + '"></div>' +
    (reg ? '<div class="f"><label class="lbl" for="hm">' + t.home + '</label><input id="hm" maxlength="60" value="' + esc(vals.home) + '"></div>' : "") +
    '<div class="f"><label class="lbl" for="pw">' + t.password + '</label><input id="pw" type="password" autocomplete="' + (reg ? "new-password" : "current-password") + '" value="' + esc(vals.password) + '"></div>' +
    (err ? '<p class="err" role="alert">' + esc(err) + "</p>" : "") +
    '<div id="cf"></div><button class="btn p" id="go"' + (busy ? " disabled" : "") + ">" + (busy ? t.wait : (reg ? t.register : t.login)) + "</button>" +
    '<p class="t">' + (reg ? t.first : t.rules) + "</p>";
  document.getElementById("tl").onclick = () => { mode = "login"; err = ""; render(); };
  document.getElementById("tr").onclick = () => { mode = "register"; err = ""; render(); };
  document.getElementById("em").oninput = (e) => { vals.email = e.target.value; };
  document.getElementById("pw").oninput = (e) => { vals.password = e.target.value; };
  if (reg) document.getElementById("hm").oninput = (e) => { vals.home = e.target.value; };
  document.getElementById("go").onclick = submit;
  mountCaptcha();
}
async function post(path, body) {
  const r = await fetch(path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  return { ok: r.ok, d };
}
async function loadMe() {
  try { const r = await fetch("/api/me"); user = r.ok ? await r.json() : null; } catch (e) { user = null; }
  render();
}
async function submit() {
  if (busy) return;
  busy = true; err = ""; render();
  try {
    const body = { email: vals.email, password: vals.password, token };
    if (mode === "register") body.home_name = vals.home;
    const { ok, d } = await post(mode === "register" ? "/api/register" : "/api/login", body);
    if (ok) { vals.password = ""; busy = false; await loadMe(); return; }
    err = msg(d.error, d);
  } catch (e) { err = msg("network"); }
  busy = false; render();
}
document.getElementById("es").onclick = () => { lang = "es"; render(); };
document.getElementById("en").onclick = () => { lang = "en"; render(); };
user = undefined; render(); loadMe();
</script>
</body>
</html>
