<style>

  .lang button { border:0; background:#fff; color:var(--blue); font:700 12px "Noto Sans",sans-serif; padding:7px 12px; min-height:34px; cursor:pointer; }

  .val { font-size:15px; font-weight:700; }

  .chip { min-height:38px; padding:0 14px; border-radius:999px; border:1.5px solid var(--blue); background:#fff; color:var(--blue); font:700 13px "Noto Sans",sans-serif; cursor:pointer; }
  .chip.on { background:var(--blue); color:#fff; }
  .item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .bar { width:6px; border-radius:3px; flex:none; }
  .info { flex:1; min-width:0; }
  .x { font-size:13px; font-weight:500; margin-top:4px; }
  .side { display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; }
  .tag { background:var(--blue); color:#fff; font-size:11px; font-weight:700; border-radius:999px; padding:4px 10px; white-space:nowrap; }
  .mini { min-height:38px; padding:0 16px; border-radius:999px; border:1.5px solid var(--blue); background:#fff; color:var(--blue); font:700 13px "Noto Sans",sans-serif; cursor:pointer; }
  .panel { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px; margin:8px 0 4px; }
  .two { display:flex; gap:10px; margin-top:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid .full { grid-column:1 / 3; }
  .nav { position:fixed; left:0; right:0; bottom:0; height:68px; background:#fff; border-top:1px solid var(--line); display:flex; max-width:480px; margin:0 auto; }
  .nav:empty { display:none; }
  [hidden] { display:none !important; }
  .nav button { flex:1; border:0; background:#fff; color:var(--muted); font:500 11px "Noto Sans",sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border-top:3px solid transparent; cursor:pointer; }
  .nav button.on { color:var(--blue); font-weight:700; border-top-color:var(--blue); }
  .nav svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  #scan[hidden] { display:none; }
  #scan video { flex:1; width:100%; min-height:0; object-fit:cover; }

  .sbar { padding:16px 20px calc(16px + env(safe-area-inset-bottom, 0px)); color:#fff; background:var(--ink); }
  .sbar .btn { background:#fff; color:var(--ink); margin-top:12px; }
  .mem { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .av { width:40px; height:40px; border-radius:50%; background:var(--blue); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
  .link { word-break:break-all; font-size:13px; font-weight:500; padding:10px 12px; border:1.5px dashed var(--blue); border-radius:12px; margin:8px 0; }
  .ph { width:48px; height:48px; border-radius:10px; object-fit:cover; border:1px solid var(--line); flex:none; align-self:center; }
  .pv { width:96px; height:96px; border-radius:14px; object-fit:cover; border:1.5px solid var(--line); flex:none; background:#fff; }
  .back { border:0; background:none; color:var(--blue); font:700 13px "Noto Sans",sans-serif; padding:6px 0; margin-bottom:4px; cursor:pointer; }

  .hero-icon { border-radius:18px; display:block; margin-bottom:18px; }

  .c3 b { display:block; font-size:17px; margin-bottom:6px; }

  .qd-name { font-size:30px; font-weight:700; letter-spacing:-0.6px; line-height:1.15; margin:0 0 4px; }
  .qd-q { font-size:20px; font-weight:700; margin:20px 0 10px; }
  .qgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qb { min-height:72px; border:2px solid var(--blue); border-radius:16px; background:#fff; color:var(--blue); font:700 20px "Noto Sans",sans-serif; cursor:pointer; padding:6px 8px; }
  .qb.on { background:var(--blue); color:#fff; }

  .bar.r { background:var(--red); }
  .qrow { display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; min-height:56px; border:0; border-bottom:1px solid var(--line); background:#fff; color:var(--ink); font:700 15px "Noto Sans",sans-serif; text-align:left; padding:0 4px; cursor:pointer; }

  .sumb b { display:block; font-size:22px; line-height:1.2; }
  .sumb span { font-size:11px; font-weight:500; color:var(--muted); }

async function post(path, body) {
  const r = await fetch(path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && user && d.error === "unauthorized") { user = null; render(); }
  return { ok: r.ok, d };
}
async function get(path) {

  return { ok: r.ok, d };
}

    const r = await post("/api/locations/" + d.b + "/rename", { name: n });
    if (!r.ok) { alert(msg(r.d.error, r.d)); return; }
    await loadData(); render();
  },
  loc_del: async (d) => {
    if (!confirm(T[lang].loc_del_q)) return;
    const r = await post("/api/locations/" + d.b + "/delete", {});
    if (!r.ok) { alert(msg(r.d.error, r.d)); return; }
    await loadData(); render();
  },
  use_full: (d) => { document.getElementById("uq").value = d.q; },
  gift_open: (d) => { act = { kind:"gift", bid:d.b }; actErr = ""; render(); },
  gift_ok: async (d) => {
    const r = await post("/api/batches/" + d.b + "/gift", { to_person_id: document.getElementById("gt").value });
    if (r.ok) { act = null; await loadData(); } else actErr = msg(r.d.error, r.d);
    render();
  },
  del_open: (d) => { act = { kind:"del", bid:d.b }; render(); },
  del_ok: async (d) => {
    const r = await post("/api/batches/" + d.b + "/delete", {});
    act = null;
    if (!r.ok) alert(msg(r.d.error, r.d));
    await loadData(); render();
  },
  go_forgot: () => { mode = "forgot"; err = ""; notice = ""; errCode = ""; render(); },
  resend: async () => {
    const tk = token, t = T[lang];
    const r = await post("/api/resend", { email: vals.email, token: tk });
    notice = r.ok ? t.resend_ok : ""; err = r.ok ? "" : msg(r.d.error, r.d); errCode = r.ok ? "" : errCode;
    render();
  },
  go_register: () => { mode = "register"; err = ""; showAccess = true; render(); window.scrollTo(0, 0); },
  go_login: () => { mode = "login"; err = ""; showAccess = true; render(); window.scrollTo(0, 0); },
  go_home: () => { showAccess = false; render(); window.scrollTo(0, 0); },
  save: saveBatch,
  scan: () => { scanMode = "add"; startScan(); },
  use_scan: () => { scanMode = "use"; startScan(); },
  qd_open: (d) => openQd(d.p),
  qd_pick: (d) => { qd.sel = Number(d.q); qd.err = ""; renderQd(); },
  qd_cancel: closeQd,
  qd_ok: async () => {
    if (!qd || qd.busy) return;
    const t = T[lang];
    if (!(qd.sel > 0)) { qd.err = t.e.invalid_quantity; renderQd(); return; }
    if (qd.mode === "cook") {
      const pid0 = qd.pid, total0 = qd.rows.reduce((a, x) => a + x.quantity, 0), used = cook.items.filter((x) => x.pid === pid0).reduce((a, x) => a + x.q, 0);
      if (qd.sel + used > total0 + 1e-9) { qd.err = msg("insufficient", { available: total0 - used }); renderQd(); return; }
      const ex = cook.items.find((x) => x.pid === pid0);
      if (ex) ex.q = Math.round((ex.q + qd.sel) * 1e6) / 1e6; else cook.items.push({ pid: pid0, name: qd.rows[0].name, unit: qd.rows[0].unit, q: qd.sel, move: false });
      cook.pick = false; ckQ = ""; closeQd(); render(); return;
    }
    qd.busy = true;
    const pid = qd.pid, name = qd.rows[0].name, u = qdUnit(qd.rows[0].unit), q = qd.sel;
    let r; try { r = await post("/api/products/" + pid + "/use", { quantity: q }); } catch (e) { r = { ok:false, d:{ error:"network" } }; }
    if (!r.ok) { qd.busy = false; qd.err = msg(r.d.error, r.d); renderQd(); return; }
    await loadData();
    const left = inv.filter((x) => x.product_id === pid).reduce((a, x) => a + x.quantity, 0);
    useMsg = t.used(name, fmtQ(q) + " " + u, fmtQ(left) + " " + u); useErr = ""; useCode = "";
    closeQd(); render();
  },
  rep_open: () => { tab = "rep"; rep = { days: 30, person: "all", data: null, err: "", busy: false, seq: rep.seq }; render(); loadReport(); },
  rep_days: (d) => { rep.days = Number(d.d); loadReport(); },
  rep_back: () => { tab = "home"; render(); },
  ck_scan: () => { scanMode = "cook"; startScan(); },
  ck_pick: () => { cook.pick = !cook.pick; render(); },
  ck_del: (d) => { cook.items.splice(Number(d.i), 1); render(); },
  ck_save: async () => {
    if (cook.busy) return;
    const t = T[lang], c = cook;
    c.err = "";
    if (!c.name.trim()) c.err = t.e.invalid_name; else if (!c.items.length) c.err = t.e.invalid_items; else if (!(Number(c.portions) > 0)) c.err = t.e.invalid_quantity; else if (!c.expiry_date) c.err = t.e.expiry_required;
    if (c.err) { render(); return; }
    c.busy = true; render();
    let r; try { r = await post("/api/meals", { name: c.name.trim(), portions: Number(c.portions), expiry_date: c.expiry_date, purchase_date: today(), owner_id: c.owner_id, items: c.items.map((x) => ({ product_id: x.pid, quantity: x.q, move: x.move })) }); } catch (e) { r = { ok:false, d:{ error:"network" } }; }
    if (!r.ok) { c.busy = false; c.err = msg(r.d.error, r.d) + (r.d.product ? " (" + r.d.product + ")" : ""); render(); return; }
    const nm = c.name.trim(); cook = freshCook(); await loadData(); cookMsg = t.ck_ok(nm); render(); window.scrollTo(0, 0);
  },
  use_enter: () => { const c = useCode; useErr = ""; useCode = ""; tab = "add"; scanMode = "add"; found = false; render(); onCode(c); },
  invite: async () => {
    homeErr = ""; homeMsg = "";
    const r = await post("/api/invitations", { email: document.getElementById("inv_email").value });
    if (r.ok) { invLink = location.origin + "/#join=" + r.d.token; await loadData(); } else homeErr = msg(r.d.error, r.d);
    render();
  },
  copy: async () => { try { await navigator.clipboard.writeText(invLink); homeMsg = T[lang].copied; } catch (e) {} render(); },
  inv_cancel: async (d) => { await post("/api/invitations/" + d.b + "/cancel", {}); invLink = ""; await loadData(); render(); },
  make_mgr: async (d) => {
    if (!confirm(T[lang].mgr_q)) return;
    homeErr = ""; homeMsg = "";
    const r = await post("/api/home/manager", { person_id: d.p });
    if (r.ok) { invLink = ""; await loadMe(); return; }
    homeErr = msg(r.d.error, r.d); render();
  },
  dl_csv: () => download("/api/export", "ihogar-inventario-" + today() + ".csv"),
  dl_json: () => download("/api/backup", "ihogar-respaldo-" + today() + ".json"),
  out: async () => { await post("/api/logout", {}); showAccess = false; user = null; vals.password = ""; inv = []; render(); }
};
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (b && actions[b.dataset.a]) actions[b.dataset.a](b.dataset);
});
document.addEventListener("input", (e) => {
  const ck = e.target.dataset && e.target.dataset.ck;
  if (ck) { cook[ck] = e.target.value; return; }
  if (e.target.id === "ck_q") { ckQ = e.target.value; document.getElementById("ck_list").innerHTML = usList(ckQ); return; }
  if (e.target.id === "us_q") { usQ = e.target.value; document.getElementById("us_list").innerHTML = usList(); return; }
  const f = e.target.dataset && e.target.dataset.f;
  if (!f) return;
  form[f] = e.target.value;
  if (f === "quantity" || f === "pack_size") { const el = document.getElementById("total_hint"); if (el) el.textContent = totalHint(); }
});
document.addEventListener("change", (e) => {
  if (e.target.dataset && e.target.dataset.rp) { rep.person = e.target.value; loadReport(); return; }
  if (e.target.dataset && e.target.dataset.ckm !== undefined) { cook.items[Number(e.target.dataset.ckm)].move = e.target.checked; return; }
  const f = e.target.dataset && e.target.dataset.f;
  if (!f) return;
  form[f] = e.target.value;
  if (f === "location_id" || f === "unit") { render(); return; }
  if (f === "category") {
    const req = form.category === "food" || form.category === "medicine";
    document.getElementById("l_exp").textContent = req ? T[lang].f_exp_req : T[lang].f_exp;
  }
  if (f === "name") {
    const p = prods.find((x) => x.name.toLowerCase() === form.name.trim().toLowerCase());
    if (p) {
      form.category = p.category || form.category; form.unit = p.unit; form.barcode = p.barcode || ""; form.min_stock = String(p.min_stock || 0); form.pack_label = p.pack_label || ""; form.pack_size = p.pack_size ? String(p.pack_size) : ""; form.item_amount = p.item_amount ? String(p.item_amount) : ""; form.item_unit = p.item_unit || "";
      ["category", "unit", "barcode", "min_stock", "pack_label", "pack_size", "item_amount", "item_unit"].forEach((k) => { document.getElementById("f_" + k).value = form[k]; });
      const req = form.category === "food" || form.category === "medicine";
      document.getElementById("l_exp").textContent = req ? T[lang].f_exp_req : T[lang].f_exp;
    }
  }
});
document.getElementById("es").onclick = () => { lang = "es"; render(); };
document.getElementById("en").onclick = () => { lang = "en"; render(); };
const jm = location.hash.match(/^#join=([\w-]+)$/);
if (jm) { inviteToken = jm[1]; mode = "register"; history.replaceState(null, "", location.pathname); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
const hv = location.hash.match(/^#verify=([\w-]+)$/), hr = location.hash.match(/^#reset=([\w-]+)$/);
if (hv || hr) history.replaceState(null, "", location.pathname);
if (hr) { resetToken = hr[1]; mode = "reset"; showAccess = true; }
if (hv) { showAccess = true; mode = "login"; post("/api/verify", { token: hv[1] }).then((r) => { notice = r.ok ? T[lang].verified_ok : ""; err = r.ok ? "" : T[lang].e.invalid_token; render(); }); }
render(); loadMe();
</script>
</body>
</html>
