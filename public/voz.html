<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de voz / Voice test</title>
<style>
  :root { --ink:#1b1d21; --blue:#1F4E9C; --green:#2E8B57; --yellow:#F2B705; --red:#C8372D; --line:#d9dce1; }
  body { margin:0; font:16px/1.45 "Noto Sans",system-ui,sans-serif; color:var(--ink); background:#fff; }
  main { max-width:480px; margin:0 auto; padding:20px; }
  h1 { font-size:24px; margin:0 0 4px; }
  p { margin:6px 0 14px; color:#555; }
  button { display:block; width:100%; min-height:60px; margin:10px 0; border:0; border-radius:14px; background:var(--blue); color:#fff; font:700 17px inherit; cursor:pointer; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .ok { color:var(--green); font-weight:700; } .no { color:var(--red); font-weight:700; }
  #out { min-height:60px; padding:12px; border:1.5px solid var(--line); border-radius:12px; font-size:20px; font-weight:700; }
  #log { font-size:13px; color:#555; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Prueba de voz / Voice test</h1>
  <p>Paso temporal de D-036. Abre esta página en tu celular con Brave. / Temporary D-036 step. Open this page on your phone in Brave.</p>
  <div id="caps"></div>
  <button id="b1">1. Hablar: "¿Cuánto vas a consumir?" / Speak</button>
  <button id="b2">2. Escuchar: di "doscientos cincuenta gramos" / Listen</button>
  <div id="out">&nbsp;</div>
  <p id="log"></p>
</main>
<script>
const $ = (id) => document.getElementById(id), log = (m) => { $("log").textContent += m + "\n"; };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
(async () => {
  let brave = false; try { brave = !!(navigator.brave && await navigator.brave.isBrave()); } catch (e) {}
  const rows = [["Navegador / Browser", brave ? "Brave" : (navigator.userAgent.includes("Chrome") ? "Chrome u otro / Chrome or other" : "Otro / Other"), true],
    ["Hablar / Speak (speechSynthesis)", "speechSynthesis" in window ? "disponible / available" : "no disponible / unavailable", "speechSynthesis" in window],
    ["Escuchar / Listen (SpeechRecognition)", SR ? "disponible / available" : "no disponible / unavailable", !!SR]];
  $("caps").innerHTML = rows.map((r) => '<div class="row"><span>' + r[0] + '</span><span class="' + (r[2] ? "ok" : "no") + '">' + r[1] + "</span></div>").join("");
})();
$("b1").onclick = () => {
  if (!("speechSynthesis" in window)) { log("Hablar no disponible."); return; }
  const u = new SpeechSynthesisUtterance("¿Cuánto vas a consumir?"); u.lang = "es-CL";
  const v = speechSynthesis.getVoices().filter((x) => x.lang.toLowerCase().startsWith("es"));
  if (v.length) u.voice = v[0];
  u.onstart = () => log("Hablando... voces en español: " + v.length); u.onerror = (e) => log("Error al hablar: " + e.error);
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};
$("b2").onclick = () => {
  if (!SR) { log("Escuchar no disponible en este navegador."); return; }
  const r = new SR(); r.lang = "es-CL"; r.interimResults = true; r.maxAlternatives = 1;
  $("out").textContent = "..."; log("Escuchando... habla ahora.");
  r.onresult = (e) => { $("out").textContent = Array.from(e.results).map((x) => x[0].transcript).join(" "); };
  r.onerror = (e) => log("Error: " + e.error + (e.message ? " (" + e.message + ")" : ""));
  r.onend = () => log("Fin de la escucha.");
  try { r.start(); } catch (e) { log("No se pudo iniciar: " + e.message); }
};
</script>
</body>
</html>
